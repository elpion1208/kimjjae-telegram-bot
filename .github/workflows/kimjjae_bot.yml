name: 김째매매법 텔레그램 알림 봇

on:
  schedule:
    # ------------------------------------------------------------------
    # [미국 서머타임(EDT, 3월~11월) 기준: 정규장 마감 16:00 EDT = 20:00 UTC (05:00 KST)]
    # - 20:03 UTC (05:03 KST, 마감 +3분): 1차(PRIMARY) 마감 직후 판정 및 발송
    # - 20:20 UTC (05:20 KST, 마감 +20분): 2차(FINAL) VIX(16:15 ET 마감) 확정 후 1차 변경 감시
    # - 20:50 UTC (05:50 KST, 마감 +50분): 2차(FINAL) DXY·FRED 반영 2차 변경 감시
    # - 21:50 UTC (06:50 KST, 마감 +110분 - 설명서 G6 기준): 2차(FINAL) 매크로 최종 변경 감시
    # ------------------------------------------------------------------
    - cron: '3 20 * * 1-5'
    - cron: '20 20 * * 1-5'
    - cron: '50 20 * * 1-5'

    # ------------------------------------------------------------------
    # [미국 동절기(EST, 11월~3월) 기준: 정규장 마감 16:00 EST = 21:00 UTC (06:00 KST)]
    # ※ 동절기에 위 20:xx UTC 스케줄이 돌더라도 main.py 내부의 미국 동부시간(ET) 장마감 가드가
    #    장중(15:xx EST) 실행을 자동으로 건너뛰므로 서머타임/동절기 전환 시 수동 수정이 불필요합니다.
    # - 21:03 UTC (06:03 KST, 마감 +3분): 1차(PRIMARY) 마감 직후 판정 (서머타임에는 2차 추가 점검)
    # - 21:20 UTC (06:20 KST, 마감 +20분): 2차(FINAL) VIX 확정 후 1차 변경 감시
    # - 21:50 UTC (06:50 KST, 마감 +50분 / 서머타임 +110분): 2차(FINAL) 변경 감시
    # - 22:50 UTC (07:50 KST, 동절기 마감 +110분 - 설명서 G6 기준): 2차(FINAL) 매크로 최종 변경 감시
    # ------------------------------------------------------------------
    - cron: '3 21 * * 1-5'
    - cron: '20 21 * * 1-5'
    - cron: '50 21 * * 1-5'
    - cron: '50 22 * * 1-5'

    # ------------------------------------------------------------------
    # [미국 조기마감일(13:00 ET 마감) 대비: 17:03 / 17:25 / 18:03 / 18:25 UTC]
    # 일반 거래일에는 장중이므로 main.py가 1초 만에 자동 스킵하고,
    # 7/3, 블랙프라이데이, 12/24 조기마감일에만 작동합니다.
    # ------------------------------------------------------------------
    - cron: '3 17 * * 1-5'
    - cron: '25 17 * * 1-5'
    - cron: '3 18 * * 1-5'
    - cron: '25 18 * * 1-5'

  # GitHub 웹사이트 Actions 탭에서 언제든 수동 실행(테스트 발송 포함) 가능
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (test: 즉시 테스트 발송 / auto: 자동 1·2차 판정 / primary: 1차 강제 / final: 2차 강제)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - auto
          - primary
          - final
      force_send:
        description: '중복 방지/무변동 조건을 무시하고 무조건 텔레그램 알림 보내기'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 김째매매법 판정 및 텔레그램 발송 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          FORCE="${{ github.event.inputs.force_send || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            python main.py --mode "$MODE" --force-send
          else
            python main.py --mode "$MODE"
          fi

      - name: 판정 상태(state.json) 저장소 자동 커밋
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json 변경사항 없음"
          else
            git commit -m "chore: update strategy state.json [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
