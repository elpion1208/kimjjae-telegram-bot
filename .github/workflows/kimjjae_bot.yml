name: 변형티큐법 텔레그램 알림 봇

on:
  # ──────────────────────────────────────────────────────────────────
  # [2026-11-11 중지] 이 봇의 리포트는 tg-strategy의 통합 리포트(TG전략 + 변형티큐)로 합쳐졌다.
  # - 예약 실행(schedule)을 제거했다. 이전 cron: '5 20', '5 21', '5 17', '5 18' (* * 1-5, UTC)
  # - cron-job.org 등 외부 호출(workflow_dispatch)은 아래 revive 입력 없이는 아무것도 실행하지 않는다.
  # 되살리려면: schedule 블록을 복구하고 run-strategy 작업의 if 조건을 지운다.
  # ──────────────────────────────────────────────────────────────────
  # GitHub 웹사이트 Actions 탭 및 cron-job.org API 호출에서 언제든 실행 가능
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (auto: 자동 판정 / test: 즉시 테스트 발송 / primary: 1차 강제 / final: 2차 강제)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - test
          - primary
          - final
      force_send:
        description: '중복 방지/무변동 조건을 무시하고 무조건 텔레그램 알림 보내기'
        required: false
        default: false
        type: boolean
      revive:
        description: '중지된 봇을 이번 한 번만 실행 (통합 리포트로 대체됨 — 평소엔 끄기)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 외부 트리거(cron-job.org)와 GitHub 스케줄이 겹쳐도 동시에 2개가 돌지 않고 순서대로 실행 → 중복 발송 방지
concurrency:
  group: kimjjae-bot
  cancel-in-progress: false

jobs:
  run-strategy:
    # 중지됨: revive 입력을 켠 수동 실행만 동작한다. 외부 예약 호출은 건너뛴다.
    if: ${{ inputs.revive == true }}
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 최신 state.json 동기화 (앞선 실행 결과 반영)
        run: |
          git fetch origin "${{ github.ref_name }}" || true
          git reset --hard "origin/${{ github.ref_name }}" || true

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          REQ_FILE=$(find . -maxdepth 2 -name "requirements.txt" | head -n 1)
          if [ -n "$REQ_FILE" ]; then
            pip install -r "$REQ_FILE"
          else
            pip install "yfinance>=0.2.40" "pandas>=2.0.0" "numpy>=1.24.0" "requests>=2.31.0" "pytz>=2023.3"
          fi

      - name: 변형티큐법 판정 및 텔레그램·디스코드 발송 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MAIN_FILE=$(find . -maxdepth 2 -name "main.py" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then
            echo "❌ 오류: 저장소에 main.py 등 파이썬 코드 파일들이 업로드되지 않았습니다!"
            echo "저장소 메인 화면(Code 탭) -> Add file -> Upload files를 눌러 config.py, kernel.py, data_fetcher.py, strategy_engine.py, telegram_formatter.py, notifier.py, main.py, state.json, requirements.txt 파일을 업로드해 주세요."
            exit 1
          fi
          MAIN_DIR=$(dirname "$MAIN_FILE")
          cd "$MAIN_DIR"
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          FORCE="${{ github.event.inputs.force_send || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            python main.py --mode "$MODE" --force-send
          else
            python main.py --mode "$MODE"
          fi

      - name: 판정 상태(state.json) 저장소 자동 커밋
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          STATE_FILE=$(find . -maxdepth 2 -name "state.json" | head -n 1)
          if [ -n "$STATE_FILE" ]; then
            cp "$STATE_FILE" /tmp/state_backup.json
            git fetch origin "${{ github.ref_name }}" || true
            git reset --hard "origin/${{ github.ref_name }}" || true
            cp /tmp/state_backup.json "$STATE_FILE"
            git add -f "$STATE_FILE"
          fi
          if git diff --staged --quiet; then
            echo "state.json 변경사항 없음"
          else
            git commit -m "chore: update strategy state.json [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || true
          fi
