name: Build Neumorphism Android Widget APK and Web Dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - "android_app/**"
      - "index.html"
      - ".github/workflows/build_android_apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Neumorphism White Dashboard and Android Widget project
        run: |
          python3 - << 'PYEOF'
          import os, base64, shutil
          FILES = {
              'index.html': '',
              'android_app/settings.gradle': '',
              'android_app/build.gradle': 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjIuMiIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjIyIiBhcHBseSBmYWxzZQp9Cg==',
              'android_app/gradle.properties': 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==',
              'android_app/app/build.gradle': '',
              'android_app/app/src/main/AndroidManifest.xml': '',
              'android_app/app/src/main/res/values/strings.xml': 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPuuzgO2Yle2LsO2BkOuylSDrjIDsi5zrs7Trk5w8L3N0cmluZz4KICAgIDxzdHJpbmcgbmFtZT0id2lkZ2V0X25hbWUiPuuzgO2Yle2LsO2BkOuylSDsi6Tsi5zqsIQg7JyE7KCvPC9zdHJpbmc+CjwvcmVzb3VyY2VzPgo=',
              'android_app/app/src/main/res/xml/tqqq_widget_info.xml': '',
              'android_app/app/src/main/res/drawable/bg_widget_card.xml': '',
              'android_app/app/src/main/res/drawable/bg_pos_bull.xml': '',
              'android_app/app/src/main/res/drawable/bg_pos_bear.xml': '',
              'android_app/app/src/main/res/drawable/bg_metric_box.xml': '',
              'android_app/app/src/main/res/drawable/bg_perf_box.xml': '',
              'android_app/app/src/main/res/drawable/bg_refresh_btn.xml': '',
              'android_app/app/src/main/res/layout/widget_tqqq.xml': '',
              'android_app/app/src/main/java/com/kimjjae/tqqqwidget/MainActivity.kt': '',
              'android_app/app/src/main/java/com/kimjjae/tqqqwidget/TqqqWidgetProvider.kt': '',
          }
          for rel_path, b64_data in FILES.items():
              os.makedirs(os.path.dirname(rel_path) or ".", exist_ok=True)
              with open(rel_path, "wb") as f:
                  f.write(base64.b64decode(b64_data))
          os.makedirs("android_app/app/src/main/assets", exist_ok=True)
          shutil.copyfile("index.html", "android_app/app/src/main/assets/dashboard.html")
          PYEOF

      - name: Auto-commit index.html to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          if ! git diff --staged --quiet; then
            git commit -m "feat: update Neumorphism white mobile web dashboard index.html [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || true
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Android Widget APK
        working-directory: android_app
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../tqqq-widget.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-widget-apk
          path: tqqq-widget.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 tqqq-widget.apk \
            --title "Neumorphism TQQQ Android Widget & Dashboard (v1.0.0)" \
            --notes "Download **tqqq-widget.apk** on your Android phone to install the Neumorphism white-edition home screen widget and detailed mobile dashboard."
